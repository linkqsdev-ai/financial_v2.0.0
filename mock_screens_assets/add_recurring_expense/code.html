<script>
        // Micro-interactions
        document.querySelectorAll('.segmented-picker label').forEach(label => {
            label.addEventListener('click', () => {
                const vibration = window.navigator.vibrate;
                if (vibration) vibration(5);
            });
        });

        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.glass-card')?.classList.add('ring-2', 'ring-primary-container/10');
            });
            input.addEventListener('blur', () => {
                input.closest('.glass-card')?.classList.remove('ring-2', 'ring-primary-container/10');
            });
        });
    </script>
